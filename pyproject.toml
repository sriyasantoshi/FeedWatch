[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feedwatch"
version = "0.1.0"
description = "High-performance asyncio UDP market data feed receiver with TCP retransmission & latency histogram"
authors = [{ name = "FeedWatch" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0"
]
